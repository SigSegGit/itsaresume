[package]
name = "itsaresume-router"
description = "Routes inference requests across backends that are never billed per token"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "itsaresume"
path = "src/main.rs"

# Test double of the `claude` CLI, used by tests/claude_process.rs and
# tests/cli.rs. Never shipped in the Docker image.
[[bin]]
name = "itsaresume-fake-claude"
path = "src/bin/itsaresume-fake-claude.rs"
test = false
doc = false

[dependencies]
humantime = "2.4.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tiny_http = "0.12.0"
toml = "1.1.6"
ureq = { version = "3.4.2", default-features = false }
wait-timeout = "0.2.1"

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
