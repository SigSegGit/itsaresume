# ADR-11: the CV generator and its router on the always-on VM, Claude first.
# Host networking: the router reaches the laptop's local model through the
# tunnel the laptop opens on the VM's 127.0.0.1:54321 (deploy/laptop/
# bionic-tunnel.sh), and the generator listens where Caddy already proxies
# cv.<domain> (127.0.0.1:18790). Nothing listens beyond 127.0.0.1.
#
# Private, never in the repository, in $DATA (default ~/itsacv-data):
#   profile.json + sources/   the owner's compiled profile (copied by the owner)
#   router.toml               the router configuration (see router.example.toml)
#   .env                      CLAUDE_CODE_OAUTH_TOKEN=... (claude setup-token)
#                             CV_HOST=cv.example.org
#                             ROUTER_URL=http://127.0.0.1:18789 (optional: the
#                             laptop's router through its tunnel, Claude first,
#                             until the VM has its own token)
#   out/ journal/             runs and the router journal
#
#   DATA=~/itsacv-data docker compose up -d --build
#
# Or let the VM follow main by itself (cv HANDOVER 3.5): auto-deploy.sh,
# run every five minutes by systemd/itsacv-deploy.timer, fast-forwards the
# checkout and runs the line above when origin/main moves; it refuses local
# edits, local commits and another branch. Install once, as the VM's user:
#   cp systemd/itsacv-deploy.* ~/.config/systemd/user/   # adjust the paths in .service
#   systemctl --user daemon-reload && systemctl --user enable --now itsacv-deploy.timer
#   loginctl enable-linger "$USER"
#   journalctl --user -u itsacv-deploy                   # what it did
services:
  router:
    image: itsaresume-router:vm
    build: ../../..
    network_mode: host
    env_file:
      - path: ${DATA:-~/itsacv-data}/.env
        required: false
    volumes:
      - ${DATA:-~/itsacv-data}/router.toml:/etc/itsaresume/config.toml:ro
      - ${DATA:-~/itsacv-data}/journal:/home/node/journal
    command: ["serve", "--config", "/etc/itsaresume/config.toml", "--listen", "127.0.0.1:8789"]
    init: true
    restart: unless-stopped

  generator:
    image: itsacv:vm
    build: ../..
    network_mode: host
    depends_on: [router]
    env_file:
      - path: ${DATA:-~/itsacv-data}/.env
        required: false
    environment:
      ITSACV_PROFILE: /data/profile.json
    volumes:
      - ${DATA:-~/itsacv-data}/profile.json:/data/profile.json:ro
      - ${DATA:-~/itsacv-data}/sources:/data/sources:ro
      - ${DATA:-~/itsacv-data}/out:/data/out
    # A shell for $CV_HOST: the image's entrypoint is node itself.
    entrypoint: ["sh", "-c"]
    command: ["exec node bin/itsacv.js serve --port 18790 --url \"$${ROUTER_URL:-http://127.0.0.1:8789}\" --timeout 1800 --out /data/out --public-host \"$$CV_HOST\" --per-day 20 --per-hour 3 --max-queued 3 $${CV_FLAGS:-}"]
    init: true
    restart: unless-stopped
