# The router on the VM (ADR-11). Copy to $DATA/router.toml.
# Claude first, on the owner's subscription: CLAUDE_CODE_OAUTH_TOKEN in
# $DATA/.env (claude setup-token). Without the token, leave this block out:
# a Claude that is not logged in STOPS the request ("Other"), it does not
# fall back.
journal = "/home/node/journal/journal.jsonl"
# 8.49: every 15 min, one tiny request to each backend that has not answered
# real traffic meanwhile, so the page offers only what can answer.
check_every_secs = 900
# 8.55: 96 checks a day exhaust a free-tier Gemini key (seen 2026-10-29:
# 429 after one real CV); check it every 6 h instead. Names a backend.
# [check_every_backend_secs]
# gemini = 21600

[[backend]]
kind = "claude-code"
name = "claude"
program = "claude"
model = "sonnet"
timeout_secs = 900

# Gemini when Claude's plan is spent. Two logins, never a key in this file:
# login = "account" (default): $DATA/gemini/ from a "Login with Google",
#   settings selecting "oauth-personal", else the router never starts it;
# login = "free-tier-key": GEMINI_API_KEY from $DATA/gemini.env, a key on a
#   project WITHOUT billing (enabling billing there would bill per token).
# Models: 2.5 is retired for new keys (404 observed 2026-10-14); on
# 2026-10-29 the free tier answered 3.6-flash and 3.5-flash(-lite) but
# 429 on 3.7/3.8-flash and flash-latest: probe before choosing.
# [[backend]]
# kind = "gemini-cli"
# name = "gemini"
# program = "gemini"
# model = "gemini-3.6-flash"
# login = "free-tier-key"
# timeout_secs = 900

# OpenAI with the owner's free-tier service-account key: OPENAI_API_KEY in
# $DATA/openai.env, never here. gpt-5-mini: the cheapest that holds the
# JSON contract. Observed 2026-10-14: "no credits remaining" (429) =
# limited, the router falls back; it answers only once the account has a
# free allowance.
# [[backend]]
# kind = "openai"
# model = "gpt-5-mini"
# timeout_secs = 600

# The laptop's local model, through the tunnel the laptop opens when it is
# on (deploy/laptop/bionic-tunnel.sh). Off: an outage, the request is
# exhausted, the page says so.
[[backend]]
kind = "lm-studio"
name = "bionic"
base_url = "http://127.0.0.1:54321/v1"
model = "qwen/qwen3-coder-next"
timeout_secs = 1500
