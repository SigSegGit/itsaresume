<!doctype html>
<!-- The link preview (Open Graph, 1200x630) and the touch icon, rendered by
     tools/brand/render.sh into web/banner.png and web/icon-180.png. -->
<html lang="fr"><head><meta charset="utf-8"><style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { width: 1200px; height: 630px; background: #0b1020; color: #e6edf7;
         font-family: "DejaVu Sans", "Segoe UI", system-ui, sans-serif;
         display: flex; align-items: center; padding: 0 96px; box-sizing: border-box;
         background-image: radial-gradient(circle at 85% 20%, #1e1b4b 0, transparent 45%),
                           radial-gradient(circle at 10% 90%, #0f2d3a 0, transparent 40%); }
  .logo { width: 184px; height: 184px; border-radius: 40px; flex: none;
          background: linear-gradient(135deg, #22d3ee, #a78bfa); color: #0b1020;
          display: flex; align-items: center; justify-content: center;
          font: 700 86px "DejaVu Sans Mono", ui-monospace, monospace; }
  .text { margin-left: 64px; }
  h1 { font-size: 104px; margin: 0; letter-spacing: -2px; font-weight: 800; }
  h1 span { color: #22d3ee; }
  p { font-size: 38px; margin: 18px 0 0; color: #b6c2d9; line-height: 1.3; }
  small { display: block; margin-top: 30px; font-size: 26px; color: #8b97b0; }
</style></head><body>
  <div class="logo">&gt;_</div>
  <div class="text">
    <h1>itsa<span>resume</span></h1>
    <p>CV sur mesure, vérifié ligne à ligne<br>contre le profil, pour chaque offre</p>
    <small>Colle une offre · reçois le CV et le rapport d’adéquation</small>
  </div>
</body></html>
